<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Stall orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dash">
  <p class="demo-banner" id="demo-banner" hidden>DEMO. Orders here come from this browser only.</p>
  <header class="top dash-top">
    <p class="kicker">Live orders</p>
    <h1 class="dash-title" id="stall-name">Stall login</h1>
    <p class="tagline" id="status-line"></p>
    <button class="close signout" id="signout" type="button" hidden>Sign out</button>
  </header>
  <section class="login" id="login" hidden>
    <form id="login-form" class="form" autocomplete="off">
      <label>Stall name<input name="login" required maxlength="60" autocapitalize="off"></label>
      <label>Access code<input name="code" required maxlength="30" autocapitalize="characters" spellcheck="false"></label>
      <button class="order" type="submit">Open dashboard</button>
      <p class="form-msg" id="login-msg" aria-live="polite"></p>
    </form>
  </section>
  <main id="board" hidden>
    <p class="count" id="new-count" aria-live="polite"></p>
    <div id="orders"></div>
    <h2 class="dash-h">Your items</h2>
    <p class="dash-p" id="stock-help"></p>
    <div id="items"></div>
  </main>
  <footer class="foot">
    <p>Keep this page open. It refreshes every 30 seconds. Your access code is for your stall only. Do not share it.</p>
    <p>Problem? Use the help form on the main site.</p>
  </footer>
  <script src="dash.js"></script>
</body>
</html>
